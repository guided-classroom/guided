<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CentreRotator — Guided</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:#1A1A2E;color:#fff;min-height:100vh;}
.nav{background:#12122A;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2A2A4A;}
.logo{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;color:#fff;}
.logo span{color:#6C63FF;}
.nav-links{display:flex;gap:10px;align-items:center;}
.nav-btn-outline{background:transparent;color:#aaa;border:1px solid #444;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;text-decoration:none;}
.main{padding:28px;max-width:1200px;margin:0 auto;}
.setup-card{background:#12122A;border-radius:20px;padding:32px;max-width:600px;margin:0 auto;}
.setup-title{font-family:"Playfair Display",serif;font-size:24px;margin-bottom:8px;}
.setup-sub{font-size:14px;color:#aaa;margin-bottom:24px;}
.setup-label{font-size:11px;font-weight:800;color:#6C63FF;letter-spacing:.05em;display:block;margin-bottom:8px;}
.time-btns{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.time-btn{background:#2A2A4A;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.time-btn.active{background:#6C63FF;}
.start-btn{width:100%;padding:16px;background:#6C63FF;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer;}
.loading{text-align:center;padding:40px;color:#aaa;}
.display{display:none;}
.timer-wrap{text-align:center;margin-bottom:32px;}
.timer-num{font-family:"Playfair Display",serif;font-size:96px;font-weight:900;line-height:1;}
.timer-num.warn{color:#FF6B6B;}
.timer-sub{font-size:15px;color:#aaa;margin-top:6px;}
.centres-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px;}
.centre-card{background:#12122A;border-radius:20px;padding:24px;border:3px solid #2A2A4A;}
.centre-card.teacher{border-color:#FFD700;background:#1C1800;}
.centre-skill{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6C63FF;margin-bottom:6px;text-transform:uppercase;}
.centre-card.teacher .centre-skill{color:#FFD700;}
.centre-name{font-size:20px;font-weight:800;margin-bottom:16px;}
.group-chip{display:inline-block;padding:8px 16px;border-radius:99px;font-size:15px;font-weight:700;margin:3px;}
.names-list{font-size:13px;color:#aaa;margin-top:8px;line-height:1.6;}
.action-btns{display:flex;gap:12px;justify-content:center;margin-bottom:16px;}
.action-btn{padding:16px 32px;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;}
.btn-start{background:#6C63FF;color:#fff;}
.btn-rotate{background:#4ECDC4;color:#1A1A2E;}
.btn-edit{background:transparent;color:#aaa;border:1px solid #444;border-radius:12px;padding:12px 24px;font-size:14px;cursor:pointer;display:block;margin:0 auto;}
.print-area{display:none;}
@media print{
  body{background:#fff;color:#000;}
  .nav,.action-btns,.btn-edit,.timer-wrap{display:none!important;}
  .display{display:block!important;}
  .print-area{display:block;}
  .centre-card{background:#f5f5f5;border:2px solid #ccc;break-inside:avoid;}
  .centre-skill,.centre-name{color:#000!important;}
  .group-chip{border:2px solid #333;}
  .names-list{color:#333!important;}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo">Guided <span>CentreRotator</span></div>
  <div class="nav-links">
    <a href="readlead.html" class="nav-btn-outline">ReadLead</a>
    <a href="progress.html" class="nav-btn-outline">Progress</a>
    <button class="nav-btn-outline" onclick="window.print()">🖨 Print</button>
    <button class="nav-btn-outline" onclick="doSignOut()">Sign Out</button>
  </div>
</nav>

<div class="main">
  <!-- SETUP -->
  <div id="setup-panel">
    <div class="setup-card">
      <div class="setup-title">CentreRotator Setup</div>
      <div class="setup-sub">Students will be automatically grouped based on their ReadLead assessment data.</div>
      
      <label class="setup-label">ROTATION TIME PER CENTRE</label>
      <div class="time-btns">
        <button class="time-btn" onclick="setTime(10,this)">10 min</button>
        <button class="time-btn active" onclick="setTime(15,this)">15 min</button>
        <button class="time-btn" onclick="setTime(20,this)">20 min</button>
        <button class="time-btn" onclick="setTime(25,this)">25 min</button>
        <button class="time-btn" onclick="setTime(30,this)">30 min</button>
      </div>

      <label class="setup-label" style="margin-bottom:8px">CENTRES (edit names if needed)</label>
      <div id="centre-inputs" style="margin-bottom:24px"></div>

      <button class="start-btn" onclick="startRotator()">▶ Start Centres</button>
      <div id="setup-msg" style="text-align:center;margin-top:12px;font-size:13px;color:#aaa;"></div>
    </div>
  </div>

  <!-- DISPLAY -->
  <div id="display-panel" class="display">
    <div class="timer-wrap">
      <div class="timer-num" id="timer-num">15:00</div>
      <div class="timer-sub">until next rotation</div>
    </div>
    <div class="centres-grid" id="centres-grid"></div>
    <div class="action-btns">
      <button class="action-btn btn-start" id="timer-btn" onclick="toggleTimer()">▶ Start Timer</button>
      <button class="action-btn btn-rotate" onclick="doRotate()">↻ Rotate Now</button>
    </div>
    <button class="btn-edit" onclick="showSetup()">⚙ Edit Setup</button>
  </div>
</div>

<!-- ALERT -->
<div id="alert-overlay" style="display:none;position:fixed;inset:0;background:rgba(108,99,255,.95);z-index:999;align-items:center;justify-content:center;flex-direction:column;text-align:center;">
  <div style="font-family:Playfair Display,serif;font-size:56px;font-weight:900;margin-bottom:12px;">⏰ Time to Rotate!</div>
  <div style="font-size:20px;color:rgba(255,255,255,.8);margin-bottom:32px;">Great work everyone!</div>
  <button onclick="doRotate()" style="background:#fff;color:#6C63FF;border:none;border-radius:14px;padding:18px 48px;font-size:22px;font-weight:800;cursor:pointer;">Rotate Groups ▶</button>
</div>

<script>
var _sb=supabase.createClient("https://ynvgikozznybuuusxbhz.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inludmdpa296em55YnV1dXN4Ymh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk4NTk2NzMsImV4cCI6MjAyNTQzNTY3M30.oCjedoInIqBkJjUb7tTGPdE5_L7yWNj6EFtQyEtxb1w");

var _students=[];
var _groups=[];
var _rotation=[];
var _minutes=15;
var _seconds=0;
var _interval=null;

var DEFAULT_CENTRES=[
  {name:"Independent Reading",skill:"Fluency Practice",teacher:false},
  {name:"Word Study",skill:"Decoding & Phonics",teacher:false},
  {name:"Tech Time",skill:"Comprehension",teacher:false},
  {name:"Writing",skill:"Application",teacher:false},
  {name:"Work with Teacher",skill:"Targeted Instruction",teacher:true}
];

var GROUP_COLORS=["#6C63FF","#FF6B9D","#4ECDC4","#FFD166","#FF8C42"];
var SKILL_KEYS=["fluency","decoding","comprehension","accuracy","selfmon"];
var SKILL_LABELS={fluency:"Fluency",decoding:"Decoding",comprehension:"Comprehension",accuracy:"Accuracy",selfmon:"Self-Monitoring"};

async function init(){
  var r=await _sb.auth.getSession();
  if(!r.data.session){window.location.href="login.html";return;}
  await loadStudents();
  loadSaved();
  renderCentreInputs();
}

async function loadStudents(){
  var r=await _sb.from("students").select("*").order("name",{ascending:true});
  _students=r.data||[];
}

function groupStudents(){
  // For each student find their weakest skill from most recent session
  var groups={};
  SKILL_KEYS.forEach(function(k){groups[k]=[];});
  var ungrouped=[];
  
  _students.forEach(function(stu){
    if(!stu.sessions||!stu.sessions.length){ungrouped.push(stu.name);return;}
    var last=stu.sessions[0];
    if(!last.ratings||!Object.keys(last.ratings).length){ungrouped.push(stu.name);return;}
    
    // Find lowest rated skill
    var lowest=null;var lowestVal=999;
    SKILL_KEYS.forEach(function(k){
      var v=last.ratings[k];
      if(v!=null&&v<lowestVal){lowestVal=v;lowest=k;}
    });
    if(lowest)groups[lowest].push(stu.name);
    else ungrouped.push(stu.name);
  });
  
  // Build group array (only non-empty groups + ungrouped)
  var result=[];
  SKILL_KEYS.forEach(function(k){
    if(groups[k].length){
      result.push({label:SKILL_LABELS[k],skill:k,names:groups[k],color:GROUP_COLORS[result.length%GROUP_COLORS.length]});
    }
  });
  if(ungrouped.length){
    result.push({label:"Unassessed",skill:"none",names:ungrouped,color:"#888"});
  }
  return result;
}

function loadSaved(){
  var saved=localStorage.getItem("guided_rotator_v3");
  if(saved){
    var d=JSON.parse(saved);
    _minutes=d.minutes||15;
    document.querySelectorAll(".time-btn").forEach(function(b){
      b.classList.remove("active");
      if(parseInt(b.textContent)===_minutes)b.classList.add("active");
    });
    if(d.centreNames){
      DEFAULT_CENTRES.forEach(function(c,i){
        if(d.centreNames[i])c.name=d.centreNames[i];
      });
    }
  }
}

function renderCentreInputs(){
  var el=document.getElementById("centre-inputs");
  el.innerHTML=DEFAULT_CENTRES.map(function(c,i){
    return"<div style='margin-bottom:10px'><input value='"+c.name+"' id='ci-"+i+"' style='width:100%;padding:10px 14px;background:#1A1A2E;border:2px solid "+(c.teacher?"#FFD700":"#2A2A4A")+";border-radius:10px;color:#fff;font-size:14px;font-family:DM Sans,sans-serif;'/></div>";
  }).join("");
}

function setTime(min,btn){
  _minutes=min;
  document.querySelectorAll(".time-btn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
}

function startRotator(){
  // Read centre names
  DEFAULT_CENTRES.forEach(function(c,i){
    var el=document.getElementById("ci-"+i);
    if(el)c.name=el.value.trim()||c.name;
  });
  
  _groups=groupStudents();
  
  if(!_groups.length||(_groups.length===1&&_groups[0].skill==="none")){
    document.getElementById("setup-msg").textContent="No assessment data found. Please complete ReadLead sessions first.";
    return;
  }
  
  // Initialize rotation order
  _rotation=_groups.map(function(g,i){return i;});
  
  saveData();
  renderDisplay();
  document.getElementById("setup-panel").style.display="none";
  document.getElementById("display-panel").style.display="block";
  resetTimer();
}

function renderDisplay(){
  var grid=document.getElementById("centres-grid");
  var numCentres=DEFAULT_CENTRES.length;
  var cols=numCentres<=3?numCentres:numCentres<=4?2:3;
  grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
  
  grid.innerHTML=DEFAULT_CENTRES.map(function(centre,ci){
    var isTeacher=centre.teacher;
    var groupIdx=_rotation[ci%_groups.length];
    var group=_groups[groupIdx];
    var html="<div class='centre-card"+(isTeacher?" teacher":"")+"'>";
    html+="<div class='centre-skill'>"+(isTeacher?"⭐ ":"")+centre.skill+"</div>";
    html+="<div class='centre-name'>"+centre.name+"</div>";
    if(group){
      html+="<span class='group-chip' style='background:"+group.color+";color:#fff'>"+group.label+"</span>";
      html+="<div class='names-list'>"+group.names.join(" · ")+"</div>";
    }
    html+="</div>";
    return html;
  }).join("");
}

function resetTimer(){
  _seconds=_minutes*60;
  updateDisplay();
  var btn=document.getElementById("timer-btn");
  btn.textContent="▶ Start Timer";
  btn.style.background="#6C63FF";
}

function toggleTimer(){
  if(_interval){
    clearInterval(_interval);_interval=null;
    document.getElementById("timer-btn").textContent="▶ Resume Timer";
  }else{
    document.getElementById("timer-btn").textContent="⏸ Pause";
    _interval=setInterval(function(){
      _seconds--;
      updateDisplay();
      if(_seconds<=0){
        clearInterval(_interval);_interval=null;
        document.getElementById("alert-overlay").style.display="flex";
      }
    },1000);
  }
}

function updateDisplay(){
  var m=Math.floor(_seconds/60);
  var s=_seconds%60;
  var el=document.getElementById("timer-num");
  el.textContent=m+":"+(s<10?"0":"")+s;
  el.className="timer-num"+(m===0&&s<=30?" warn":"");
}

function doRotate(){
  document.getElementById("alert-overlay").style.display="none";
  var last=_rotation.pop();
  _rotation.unshift(last);
  saveData();
  renderDisplay();
  resetTimer();
}

function showSetup(){
  if(_interval){clearInterval(_interval);_interval=null;}
  document.getElementById("display-panel").style.display="none";
  document.getElementById("setup-panel").style.display="block";
}

function saveData(){
  var centreNames=DEFAULT_CENTRES.map(function(c){return c.name;});
  localStorage.setItem("guided_rotator_v3",JSON.stringify({minutes:_minutes,centreNames:centreNames,rotation:_rotation}));
}

async function doSignOut(){
  await _sb.auth.signOut();
  window.location.href="login.html";
}

init();
</script>
</body>
</html>
